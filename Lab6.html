<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>


        .flex-parent{
            border:1px solid;
            height: 100vh;
            display: flex;
            align-items: center;
            flex-direction: center;
            justify-content: space-evenly;
        }
        img{
            box-sizing: border-box;
        }
        .child1{
            min-height: 20px;
        }
        .child2{
            min-height: 1px;
        }
        .child3{
            min-height: 1px;
        }
    </style>
</head>
<body>
    <div class="flex-parent">
        <img class = "child1" src="https://picsum.photos/100/100?random=1" alt="Image 1">
        <img class = "child2" src="https://picsum.photos/200/200?random=2" alt="Image 2">
        <img class = "child3" src="https://picsum.photos/100/100?random=3" alt="Image 3">
    </div>
</body>
</html>
