<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>
   <form action="#">
        <label for="name">Enter your name:</label>
        <input type="text" id="name">
        <button type="button" id="greet">Greet Me</button>
        <h2 id="display"></h2>

       <label for="number1">Your first number</label>
       <input type="number" id="number1">
       <label for="number2">Your second number</label>
       <input type="number" id="number2">
       <p id="result"></p>




       <p>What would you like to do with the numbers:</p>
       <input type="radio" name="operation" value="addition">Addition<br>
       <input type="radio" name="operation" value="subtraction">Subtraction<br>
       <input type="radio" name="operation" value="multiplication">Multiplication<br>
       <input type="radio" name="operation" value="division">Division<br>
       <button type="button" id="select">Select</button>
       <button type="button" id="clear">Clear</button>
    </form>



   <script>
        document.getElementById('greet').addEventListener('click', function() {
            const yourName = document.getElementById('name').value;
            document.getElementById('display').textContent = "Hello, " + yourName;
       });
       
       const number1 = document.getElementById('number1');
       const number2 = document.getElementById('number2');
       let result = document.getElementById('result');
       document.getElementById('select').addEventListener('click', function(){
           const operation = document.querySelector('[name = operation]:checked');
           const num1 = Number(number1.value)
           const num2 = Number(number2.value)
           if (operation.value === 'addition') {
               result.textContent = num1 + num2;
           } else if (operation.value === 'subtraction') {
               result.textContent = num1 - num2;
           } else if (operation.value === 'multiplication') {
               result.textContent = num1 * num2;
           } else if (operation.value === 'division') {
               result.textContent = num1 / num2;
           }
       });

        document.getElementById('clear').addEventListener('click', function() {
           number1.value = "";
           number2.value = "";
           result.textContent = "";
           document.querySelector('[name = operation]:checked').checked = false;
       });
   </script>
</body>
</html>
