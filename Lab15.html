<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Posts </title>


   <style>
      body {
         background-color: #f0f2f5;
         font-family: Helvetica, Arial, sans-serif;
      }


      form {
         min-height: 180px;
      }


      article, form {
         background-color: #ffffff;
         border-radius: 8px;
         box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
         padding: 12px 16px;
         margin-bottom: 16px;
         max-width: 680px;
         margin-left: auto;
         margin-right: auto;
      }


      h2 {
         color: #050505;
         font-size: 0.9375rem;
         font-weight: 600;
         margin: 0 0 4px 0;
      }


      p {
         color: #050505;
         font-size: 0.9375rem;
         line-height: 1.3333;
         margin: 8px 0 0 0;
      }
   </style>
</head>


<body>
<h1> Welcome to my Posts page! </h1>


   <form action="#">


       <label for="userID">Select User:</label>
       <select id="userID">
           <option value="">--Please choose an option--</option>
           <option value="1">User 1</option>
           <option value="2">User 2</option>
           <option value="3">User 3</option>
           <option value="4">User 4</option>
           <option value="5">User 5</option>
           <option value="6">User 6</option>
           <option value="7">User 7</option>
       </select>


       <button type="button" id="filterBtn">Filter</button>


       <br><br>


       <label for="displayUserID">Enter User ID:</label>
       <input type="number" id="displayUserID" min="1" max="10">


       <button type="button" id="displayUserBtn">Display User Posts</button>


       <br><br>


       <label for="postID">Enter Post ID:</label>
       <input type="number" id="postID" min="1" max="100">


       <button type="button" id="findBtn">Find</button>


   </form>


   <script>
       // Task 1
       const api = 'https://jsonplaceholder.typicode.com/posts';

       let posts =[];

       const getPosts = async()=>
       {
           try {
           const response = await fetch(api);
           const data = await response.json();

           posts = data;

           console.table(posts)
           renderPosts(posts)
           } catch { (error) => console.log(error);
              
           }
       }
       getPosts()
       // Task 2
       const container = document.createElement("div");
       document.body.appendChild(container);

       const renderPosts = (posts) => {
         document.querySelectorAll('article').forEach((article) => {
            article.remove();
         });



         posts.forEach(post => {
            const article = document.createElement("article");

            const heading = document.createElement("h2");
            heading.textContent = post.title;

            const paragraph = document.createElement("p");
            paragraph.textContent = post.body

            const userInfo = document.createElement("p");
            userInfo.textContent =
               `User ID: ${post.userId} | Post ID: ${post.id}`;

            article.appendChild(heading);
            article.appendChild(paragraph);
            article.appendChild(userInfo);

            container.appendChild(article);
         });
       };

       // Task 3
       const userDropdown = document.getElementById("userID");
       const filterBtn = document.getElementById("filterBtn");

       filterBtn.addEventListener("click", () => {
         const selectedUser = userDropdown.value;

         console.log(selectedUser);

       // Task 4
         const filteredPosts = posts.filter(post => {
        return post.userId == selectedUser;
    });

    console.table(filteredPosts);
   });

       // Task 5
      const displayUserID = document.getElementById("displayUserID");
      const displayUserBtn = document.getElementById("displayUserBtn");
      
      displayUserBtn.addEventListener("click", () => {

      const userID = displayUserID.value;

        const userPosts = posts.filter(post => {
        return post.userId == userID;
    });

    renderPosts(userPosts);

});
       // Task 6
      findBtn.addEventListener("click", () => {
         const enteredID = postID.value;
         const foundPost = posts.find(post => {
            return post.id == enteredID
         });

         if (foundPost) {
            renderPosts([foundPost])
         } else {
            container.innerHTML = "<p>Post not found!</p>";
         }
      });

   </script>


</body>
</html>
