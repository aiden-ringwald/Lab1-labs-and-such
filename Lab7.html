<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Test</title>
   <style>
        body {
            margin: 0;
        }
       #flex-parent1{
           display: flex;
           width: 100vw;
           height: 100vh;
       }
       #flex-parent2{
           display: flex;
           width: 150px;
           height: 100vh;
           background-color: orange;
           flex-shrink: 0;
           flex-direction: column;
           align-items: center;
           justify-content: space-between;
           padding: 30px 0px;
       }
       #flex-parent2 > div{
           font-size: 40px;
       }
       #top-icons {
           display: flex;
           flex-direction: column;
           align-items: center;
       }
       #bottom-icons {
           display: flex;
           justify-content: center;
           margin-top: auto;
       }
       #flex-parent3{
           display: flex;
           flex-wrap: wrap;
           gap: 2px 2px;
           overflow-y: auto;
           flex: 1;
           min-width: 0;
           overflow-y: auto;
       }
       img{
           flex-grow: 1;
       }
   </style>
</head>

   <div id="flex-parent1">
